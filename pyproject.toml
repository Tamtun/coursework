[project]
name = "coursework"
version = "0.1.0"
description = ""
authors = [
    {name = "Tamtun",email = "inteslux@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest (>=8.3.5,<9.0.0)",
    "pytest-mock (>=3.14.0,<4.0.0)",
    "flask (>=3.1.0,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 119

[flake8]
max-line-length = 119

[tool.isort]
profile = "black"

[tool.mypy]
files = "src"  # указывай путь к папке с исходным кодом



