[project]
name = "coursework"
version = "0.1.0"
description = ""
authors = [
    {name = "Tamtun", email = "inteslux@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.3.5,<9.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "flask>=3.1.0,<4.0.0",
    "requests>=2.32.3,<3.0.0",
    "pandas>=2.2.3,<3.0.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.black]
line-length = 119
exclude = '''
/(
    \.git
    | __pycache__
    | venv
    | env
    | \.mypy_cache
    | \.pytest_cache
)/
'''

[tool.isort]
profile = "black"
line_length = 119
known_first_party = ["src"]
known_third_party = ["flask", "pandas", "numpy", "requests"]
default_section = "THIRDPARTY"

[tool.mypy]
files = "src"
disallow_untyped_defs = true
warn_return_any = true
exclude = [
    "^venv/",
    "^\.git/"
]